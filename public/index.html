<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProTanki Clicker</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root { --bg:#111; --panel:#1b1b1b; --line:#333; --text:#eee; --muted:#999; --accent:#ffc107; --ok:#3ddc84; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; color:var(--accent); }
  #version { margin-left:auto; font-family: ui-monospace, Consolas, monospace; }
  .pill { font-size:12px; padding:2px 8px; border-radius:10px; background:#333; color:var(--muted); }
  .pill.on { background:rgba(61,220,132,.15); color:var(--ok); }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  section h2 { font-size:15px; margin:0 0 10px; color:var(--accent); }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input, select { width:100%; padding:7px 9px; background:#0c0c0c; color:var(--text); border:1px solid var(--line); border-radius:5px; }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .check { display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--text); }
  .check input { width:auto; }
  button { padding:7px 12px; border:0; border-radius:5px; background:#2a2a2a; color:var(--text); cursor:pointer; }
  button:hover { background:#383838; }
  button.primary { background:var(--accent); color:#111; font-weight:600; }
  button.danger { background:#5a2323; }
  button.good { background:#1f4d33; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:6px 6px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--muted); font-weight:500; }
  .status-running { color:var(--ok); }
  .status-stopped { color:var(--muted); }
  #log { height:360px; overflow:auto; background:#0a0a0a; border:1px solid var(--line); border-radius:6px; padding:8px; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  .log-error { color:var(--bad); }
  .log-info { color:var(--accent); }
  .log-log { color:#cfcfcf; }
  .msg { font-size:12px; margin-top:8px; min-height:16px; color:var(--muted); }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--bad); }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>ProTanki Clicker</h1>
  <span id="conn" class="pill">disconnected</span>
  <span id="runCount" class="pill">0 running</span>
  <span id="version" class="pill" title="Deployed build">version …</span>
</header>

<main>
  <section>
    <h2>Connection</h2>
    <label for="target">Game server (host:port)</label>
    <input id="target">
    <label for="proxy">SOCKS5 proxy URL (optional)</label>
    <input id="proxy" placeholder="socks5://user:pass@host:1080">
    <div class="row">
      <div>
        <label for="language">Language code</label>
        <input id="language">
      </div>
      <div>
        <label for="retryMs">Join retry (ms)</label>
        <input id="retryMs" type="number" min="50">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="sessionTimeoutSec">Session wait (s)</label>
        <input id="sessionTimeoutSec" type="number" min="5">
      </div>
      <div></div>
    </div>
    <label class="check"><input id="joinOnLeave" type="checkbox"> Join automatically when a user leaves</label>
    <label class="check"><input id="logProtocol" type="checkbox"> Log decoded protocol packets</label>
    <div class="actions">
      <button class="primary" onclick="saveConfig()">Save settings</button>
    </div>
    <div id="cfgMsg" class="msg"></div>
  </section>

  <section>
    <h2>Accounts</h2>
    <table>
      <thead><tr><th>On</th><th>Account</th><th>Battle ID or link</th><th>Side</th><th>Password</th><th></th></tr></thead>
      <tbody id="accounts"></tbody>
    </table>
    <div class="actions">
      <button onclick="addAccount()">+ Add account</button>
      <button class="good" onclick="startAll()">Start all enabled</button>
      <button class="danger" onclick="stopAll()">Stop all</button>
      <button class="primary" onclick="saveConfig()">Save accounts</button>
    </div>
    <div class="hint">Paste a battle link like <code>#/battle/e2e702ee47fa9be8</code> or just the id — both work. Leave a password blank to keep the saved one. Passwords are never shown back.</div>
    <div id="accMsg" class="msg"></div>
  </section>

  <section style="grid-column: 1 / -1;">
    <h2>Live log</h2>
    <div id="log"></div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const state = { config: null, running: new Set() };
  const socket = io();

  function setMsg(id, text, kind) {
    const el = $(id);
    el.textContent = text;
    el.className = "msg " + (kind || "");
  }

  function renderConfig(cfg) {
    state.config = cfg;
    $("target").value = cfg.target;
    $("proxy").value = cfg.proxy;
    $("language").value = cfg.language;
    $("retryMs").value = cfg.retryMs;
    $("sessionTimeoutSec").value = cfg.sessionTimeoutSec;
    $("joinOnLeave").checked = cfg.joinOnLeave;
    $("logProtocol").checked = cfg.logProtocol;
    renderAccounts(cfg.accounts);
  }

  function renderAccounts(accounts) {
    const tbody = $("accounts");
    tbody.innerHTML = "";
    accounts.forEach((a, i) => {
      const tr = document.createElement("tr");
      const running = state.running.has(a.username.toLowerCase());
      tr.innerHTML = `
        <td><input type="checkbox" data-i="${i}" data-k="enabled" ${a.enabled ? "checked" : ""}></td>
        <td><input data-i="${i}" data-k="username" value="${escapeAttr(a.username)}"></td>
        <td><input data-i="${i}" data-k="battleId" value="${escapeAttr(a.battleId)}"></td>
        <td><select data-i="${i}" data-k="side">
          ${["J","Alpha","Bravo"].map((s) => `<option ${s === a.side ? "selected" : ""}>${s}</option>`).join("")}
        </select></td>
        <td><input type="password" data-i="${i}" data-k="password" placeholder="${a.password ? "saved" : "password"}"></td>
        <td>
          ${running
            ? `<button class="danger" onclick="stopOne(${i})">Stop</button>`
            : `<button class="good" onclick="startOne(${i})">Start</button>`}
          <button onclick="removeAccount(${i})">✕</button>
        </td>`;
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll("input,select").forEach((el) => {
      el.addEventListener("change", (e) => {
        const i = Number(e.target.dataset.i);
        const k = e.target.dataset.k;
        state.config.accounts[i][k] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
      });
    });
  }

  function escapeAttr(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  function collectConfig() {
    const cfg = { ...state.config };
    cfg.target = $("target").value.trim();
    cfg.proxy = $("proxy").value.trim();
    cfg.language = $("language").value.trim();
    cfg.retryMs = Number($("retryMs").value);
    cfg.sessionTimeoutSec = Number($("sessionTimeoutSec").value);
    cfg.joinOnLeave = $("joinOnLeave").checked;
    cfg.logProtocol = $("logProtocol").checked;
    tbodyInputs();
    return cfg;
  }

  function tbodyInputs() {
    document.querySelectorAll("#accounts input[type=password]").forEach((el) => {
      const i = Number(el.dataset.i);
      if (el.value) state.config.accounts[i].password = el.value;
      else state.config.accounts[i].password = "";
    });
  }

  async function saveConfig() {
    if (!state.config) return;
    const body = JSON.stringify(collectConfig());
    try {
      const res = await fetch("/api/config", { method: "PUT", headers: { "Content-Type": "application/json" }, body });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "save failed");
      renderConfig(data.config);
      setMsg("cfgMsg", "Saved. Changes apply to the next start.", "ok");
      setMsg("accMsg", "Saved.", "ok");
    } catch (err) {
      setMsg("cfgMsg", "Save failed: " + err.message, "err");
    }
  }

  function addAccount() {
    if (!state.config) return;
    state.config.accounts.push({ username: "", password: "", battleId: "", side: "J", enabled: true });
    renderAccounts(state.config.accounts);
  }

  function removeAccount(i) {
    state.config.accounts.splice(i, 1);
    renderAccounts(state.config.accounts);
  }

  function startOne(i) {
    const acc = state.config.accounts[i];
    socket.emit("start", acc.username, (res) => {
      if (!res.ok) setMsg("accMsg", `${acc.username}: ${res.error}`, "err");
    });
  }

  function stopOne(i) {
    socket.emit("stop", state.config.accounts[i].username, () => {});
  }

  function startAll() {
    socket.emit("start-all", null, (res) => {
      setMsg("accMsg", `Started ${res.results.filter((r) => r.ok).length} of ${res.results.length}`, "ok");
    });
  }

  function stopAll() {
    socket.emit("stop-all", null, () => setMsg("accMsg", "Stopped all.", "ok"));
  }

  function appendLog(entry) {
    const log = $("log");
    const div = document.createElement("div");
    const kind = entry.level === "error" ? "log-error" : entry.level === "info" ? "log-info" : "log-log";
    div.className = kind;
    const who = entry.username ? `[${entry.username}] ` : "";
    div.textContent = `${new Date(entry.time).toLocaleTimeString()} ${who}${entry.message}`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function updateRunCount() {
    $("runCount").textContent = `${state.running.size} running`;
    $("runCount").className = "pill" + (state.running.size ? " on" : "");
  }

  socket.on("connect", () => { $("conn").textContent = "connected"; $("conn").className = "pill on"; });
  socket.on("disconnect", () => { $("conn").textContent = "disconnected"; $("conn").className = "pill"; });

  socket.on("hello", (data) => {
    state.running = new Set(data.running);
    updateRunCount();
    data.logs.forEach(appendLog);
    if (state.config) renderAccounts(state.config.accounts);
  });

  socket.on("log", appendLog);

  socket.on("status", ({ username, status }) => {
    const key = username.toLowerCase();
    if (status === "running") state.running.add(key); else state.running.delete(key);
    updateRunCount();
    if (state.config) renderAccounts(state.config.accounts);
  });

  fetch("/api/config").then((r) => r.json()).then(renderConfig);
  fetch("/health")
    .then((r) => r.json())
    .then((data) => { $("version").textContent = "version " + (data.version || "unknown"); })
    .catch(() => { $("version").textContent = "version unknown"; });
</script>
</body>
</html>
