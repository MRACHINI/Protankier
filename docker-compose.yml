services:
  protanki-clicker:
    image: ghcr.io/mrachini/protankier:latest
    container_name: protanki-clicker
    ports:
      - "3005:3005"
    volumes:
      - ./data:/data
    environment:
      - PORT=3005
      - DATA_DIR=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
