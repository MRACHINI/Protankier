name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'rewrite/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust compile (visible output)
        id: rust
        continue-on-error: true
        run: |
          rustup toolchain install stable --profile minimal
          cargo update -p time@0.3.21 --precise 0.3.36 || true
          cargo build --release -p server-click > cargo-build.log 2>&1
          echo "exit=$?" >> cargo-build.log
          tail -n 400 cargo-build.log

      - name: Build debug server-click with frame trace
        run: |
          cargo build -p server-click
          cp target/debug/server-click server-click-debug

      - name: Upload debug server-click
        uses: actions/upload-artifact@v4
        with:
          name: server-click-debug
          path: server-click-debug
          if-no-files-found: error

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-log
          path: cargo-build.log
          if-no-files-found: ignore

      - name: Fail if Rust build failed
        if: steps.rust.outcome == 'failure'
        run: exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
